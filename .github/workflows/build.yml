name: Build

# Produces native Linux and Windows binaries from a single runner set.
# Windows targets are cross-compiled with MinGW-w64, so one toolchain covers
# both platforms and both artifacts come out of the same job definition.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RAYLIB_VERSION: "5.5"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (x86_64)
            id: linux
            archive: tar.gz
          - label: Windows (x86_64, MinGW)
            id: windows
            archive: zip

    steps:
      - uses: actions/checkout@v4

      # raylib is compiled from a pinned tag for every target so a release is
      # reproducible regardless of what the runner image happens to ship.
      - name: Check out raylib
        uses: actions/checkout@v4
        with:
          repository: raysan5/raylib
          ref: ${{ env.RAYLIB_VERSION }}
          path: .raylib

      - name: Install Linux build dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxxf86vm-dev libxext-dev \
            libasound2-dev libwayland-dev libxkbcommon-dev \
            xvfb

      - name: Install MinGW-w64 cross toolchain
        if: matrix.id == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-mingw-w64-x86-64 zip unzip

      # Static raylib keeps the published bundles self-contained: players do not
      # need a system raylib install, and the Windows .exe carries no DLL imports.
      - name: Build raylib (Linux)
        if: matrix.id == 'linux'
        run: |
          cmake -S .raylib -B build-raylib -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/raylib-install"
          cmake --build build-raylib
          cmake --install build-raylib

      - name: Build raylib (Windows)
        if: matrix.id == 'windows'
        run: |
          cmake -S .raylib -B build-raylib -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-mingw-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/raylib-install"
          cmake --build build-raylib
          cmake --install build-raylib

      - name: Configure game
        env:
          ID: ${{ matrix.id }}
        run: |
          # Hand CMake the exact raylib we just built. Auto-discovery is not
          # reliable here: raylib's raylib-config.cmake is really a find-module
          # in disguise, and pkg-config resolves .pc files against the host
          # rather than the cross sysroot.
          common=(
            -GNinja
            -DCMAKE_BUILD_TYPE=Release
            -DRAYLIB_INCLUDE_DIR="$PWD/raylib-install/include"
            -DRAYLIB_LIBRARY="$PWD/raylib-install/lib/libraylib.a"
          )

          if [ "$ID" = "windows" ]; then
            cmake -S . -B build "${common[@]}" \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-mingw-x86_64.cmake" \
              -DPUZZLEDCHESS_STATIC_RUNTIME=ON
          else
            cmake -S . -B build "${common[@]}"
          fi

      - name: Build game
        run: cmake --build build

      # `cmake --install` gives both targets the same layout:
      #   <prefix>/bin/<executable>   and   <prefix>/assets/
      - name: Stage bundle
        run: |
          cmake --install build --prefix "$PWD/dist"
          chmod -R a+rX dist
          test -f dist/assets/lichess_db_puzzle.csv
          echo "::group::bundle layout"
          find dist -maxdepth 2 | head -30
          echo "::endgroup::"

      - name: Verify Linux bundle is self-contained
        if: matrix.id == 'linux'
        run: |
          # raylib is statically linked, so the published binary must not need
          # libraylib.so present on the player's machine.
          if ldd dist/PuzzledChess | grep -i raylib; then
            echo "error: binary still links raylib dynamically" >&2
            exit 1
          fi
          ldd dist/PuzzledChess

      - name: Verify Windows executable
        if: matrix.id == 'windows'
        run: |
          test -f dist/PuzzledChess.exe
          file dist/PuzzledChess.exe
          if x86_64-w64-mingw32-objdump -p dist/PuzzledChess.exe | grep -q 'DLL Name'; then
            echo "::warning::binary still imports DLLs; the static runtime option did not apply"
          else
            echo "No DLL imports - the executable is self-contained."
          fi
          # The build is fully static, so the bundle should be just the .exe and
          # its assets. Anything else is either a stray file or a runtime DLL
          # that would no longer be used.
          strays=$(find dist -maxdepth 1 -mindepth 1 ! -name PuzzledChess.exe ! -name assets)
          if [ -n "$strays" ]; then
            echo "::error::unexpected files at the root of the bundle:"
            echo "$strays"
            exit 1
          fi
          if find dist -iname '*.dll' | grep -q .; then
            echo "::error::runtime DLLs were bundled even though the build is static:"
            find dist -iname '*.dll'
            exit 1
          fi

      - name: Smoke test (offscreen)
        if: matrix.id == 'linux'
        run: |
          # Run the *packaged* bundle the way a player will: from inside the
          # staged directory, with the repository root NOT as the working
          # directory. Running from the repo root would silently satisfy the
          # "./assets" lookups from the source tree and hide a broken layout.
          # The runner has no sound card, so ALSA/PulseAudio chatter and
          # raylib's "Failed to create buffer" warnings are expected and must
          # not be treated as failures.
          set +e
          ( cd dist && xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              timeout 10 ./PuzzledChess ) > smoke.log 2>&1
          status=$?
          set -e
          cat smoke.log
          # 124 means the timeout fired while the game was still running: success.
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "::error::smoke test exited with status $status"
            exit 1
          fi
          if grep -qE "Failed to load (texture|image|sound|music)|FILEIO: Failed to open|no usable puzzle|Could not load the puzzle database" smoke.log; then
            echo "::error::the game could not load an asset or a puzzle from the packaged bundle"
            grep -E "Failed to load|FILEIO: Failed to open|usable puzzle|puzzle database" smoke.log
            exit 1
          fi
          loaded=$(grep -c "File loaded successfully" smoke.log || true)
          moves=$(grep -c "THE MOVES" smoke.log || true)
          echo "Packaged bundle loaded $loaded files and dealt $moves puzzle(s)."

      - name: Package
        env:
          ID: ${{ matrix.id }}
        run: |
          # Put everything inside a single top-level directory so extracting the
          # archive does not spray files across the current folder. Both archive
          # formats are written from the workspace root so they agree on that.
          stage="PuzzledChess-$ID-x86_64"
          mkdir -p "$stage"
          cp -a dist/. "$stage"/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -qr "$stage.zip" "$stage"
          else
            tar -czf "$stage.tar.gz" "$stage"
          fi
          rm -rf "$stage"

          # Verify the archive really is wrapped in the top-level directory.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            unzip -Z1 "$stage.zip" | grep -q "^$stage/PuzzledChess.exe$" \
              || { echo "::error::$stage.zip is not wrapped in a top-level directory"; exit 1; }
          else
            tar -tzf "$stage.tar.gz" | grep -q "^$stage/PuzzledChess$" \
              || { echo "::error::$stage.tar.gz is not wrapped in a top-level directory"; exit 1; }
          fi
          ls -lh PuzzledChess-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PuzzledChess-${{ matrix.id }}-x86_64
          path: PuzzledChess-${{ matrix.id }}-x86_64.*
          if-no-files-found: error
          retention-days: 30

  # Waits for both platforms, then attaches the archives to a GitHub Release.
  # Runs for tag pushes so a pushed v1.0.0 produces a downloadable release.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and checksums
        run: |
          mkdir -p publish
          find artifacts -type f \( -name 'PuzzledChess-*.tar.gz' -o -name 'PuzzledChess-*.zip' \) \
            -exec cp {} publish/ \;
          cd publish
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo is required: this job has no checkout, so gh cannot infer
          # the repository from git.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" publish/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PuzzledChess $GITHUB_REF_NAME" \
              --generate-notes \
              publish/*
          fi